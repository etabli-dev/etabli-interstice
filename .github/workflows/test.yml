name: Test runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -v
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/outbox.test.cjs
      - run: docker build --build-arg REVISION="$GITHUB_SHA" -t interstice-ci .
      - name: Container startup, lease and backup checks
        run: bash scripts/check-container.sh interstice-ci

      - name: Audit image and produce software inventory
        run: sh scripts/audit-image.sh interstice-ci image-artifact
      - name: Export tested image
        run: |
          mkdir -p image-artifact
          docker image inspect interstice-ci --format '{{json .}}' > image-artifact/image-inspect.json
          docker tag interstice-ci "etabli-interstice:${GITHUB_SHA}"
          docker save "etabli-interstice:${GITHUB_SHA}" | gzip -1 > image-artifact/image.tar.gz
          (cd image-artifact && sha256sum image.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-container-${{ github.sha }}
          path: image-artifact/
          retention-days: 14
          compression-level: 0
